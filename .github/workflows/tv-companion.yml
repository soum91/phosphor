name: Android TV companion

on:
  push:
    branches: [main]
    paths: ["TVCompanion/**", ".github/workflows/tv-companion.yml"]
  pull_request:
    branches: [main]
    paths: ["TVCompanion/**", ".github/workflows/tv-companion.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compile Android TV companion
        run: gradle -p TVCompanion :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-TV-Companion-debug
          path: TVCompanion/app/build/outputs/apk/debug/app-debug.apk
