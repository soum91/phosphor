name: Android TV companion

on:
  push:
    branches: [main]
    paths: ["TVCompanion/**", ".github/workflows/tv-companion.yml"]
  pull_request:
    branches: [main]
    paths: ["TVCompanion/**", ".github/workflows/tv-companion.yml"]
  workflow_dispatch:

concurrency:
  group: obsidian-tv-companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed version UI contract
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          else
            python "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compile Android TV companion
        run: gradle -p TVCompanion :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-TV-Companion-debug
          path: TVCompanion/app/build/outputs/apk/debug/app-debug.apk
